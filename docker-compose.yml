# docker-compose.yml — content-pipeline-stack
# 9 服务: 4 default + 5 v6-workers (profile)
# 设计: 纯源码模式, 所有路径走 .env
# 别人部署: cp .env.example .env → 改路径 → docker compose up

services:

  # ─── content-pipeline-mcp (MCP protocol layer, 17 tools) ──────────────────
  content-pipeline-mcp:
    build:
      context: ./services/content-pipeline-mcp
      dockerfile: Dockerfile
    image: ${REGISTRY_URL:-localhost:5000}/content-pipeline-stack/content-pipeline-mcp:${IMAGE_TAG:-0.1.0}
    container_name: content-pipeline-mcp
    restart: unless-stopped
    ports:
      - "28092:18092"
    environment:
      NODE_ENV: production
      HOST: "0.0.0.0"
    env_file:
      - ./.env
    volumes:
      # Read-only access to pipeline data dir (queue.db, transcripts, cookies)
      - ${DATA_DIR}:${DATA_DIR}:ro
    deploy:
      resources:
        limits:
          memory: 2G          # 跟 systemd MemoryMax=2G
          cpus: "1.5"
        reservations:
          memory: 1G          # 跟 systemd MemoryHigh=1G
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:18092/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - content-pipeline-net

  # ─── file-service (Node.js video/file browsing + upload) ─────────────────────
  file-service:
    build:
      context: ./services/file-service
      dockerfile: Dockerfile
    image: ${REGISTRY_URL:-localhost:5000}/content-pipeline-stack/file-service:${IMAGE_TAG:-0.1.0}
    container_name: file-service
    restart: unless-stopped
    ports:
      - "28098:18098"
    environment:
      NODE_ENV: production
      PORT: "18098"
      FS_DATA_ROOT: ${DATA_DIR}/files
    env_file:
      - ./.env
    volumes:
      - ${DATA_DIR}:${DATA_DIR}
      - ${UPLOADS_DIR}:${UPLOADS_DIR}
      - ${OPENCLAW_DIR}:${OPENCLAW_DIR}
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    networks:
      - content-pipeline-net
    depends_on:
      - content-pipeline-mcp

  # ─── douyin-recorder (DouyinLiveRecorder upstream, ffmpeg + nodejs) ─────────
  douyin-recorder:
    profiles: ["v6-workers"]
    build:
      context: ./services/douyin-recorder/source
      dockerfile: ../Dockerfile
    image: ${REGISTRY_URL:-localhost:5000}/content-pipeline-stack/douyin-recorder:${IMAGE_TAG:-0.1.0}
    container_name: douyin-recorder
    restart: unless-stopped
    stdin_open: true
    tty: true
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      PYTHONUNBUFFERED: "1"
    volumes:
      - ${RECORDER_DIR}/config:/app/config
      - ${RECORDER_DIR}/downloads:/app/downloads
      - ${RECORDER_DIR}/logs:/app/logs
      - ${RECORDER_DIR}/backup_config:/app/backup_config
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: "1.5"
    networks:
      - content-pipeline-net
    depends_on:
      - content-pipeline-mcp

  # ─── v6-monitor (抖音账号监控 daemon, 6h 间隔) ─────────────────────────────
  v6-monitor:
    build:
      context: ./services/v6-monitor
      dockerfile: Dockerfile
    image: ${REGISTRY_URL:-localhost:5000}/content-pipeline-stack/v6-monitor:${IMAGE_TAG:-0.1.0}
    container_name: v6-monitor
    restart: unless-stopped
    environment:
      V6_WORKDIR: ${DATA_DIR}
      MCP_URL: http://content-pipeline-mcp:18092/mcp
      DOUYIN_COOKIE_PATH: ${DATA_DIR}/config/cookies
      TZ: ${TZ:-Asia/Shanghai}
    env_file:
      - ./.env
    volumes:
      - ${DATA_DIR}:${DATA_DIR}
      - ${OPENCLAW_DIR}/workspace/skills/brand-video-tools:${OPENCLAW_DIR}/workspace/skills/brand-video-tools
    deploy:
      resources:
        limits:
          memory: 200M
          cpus: "0.5"
    networks:
      - content-pipeline-net
    depends_on:
      - content-pipeline-mcp

  # ─── v6-enqueue (cron-driven, sleep infinity + docker compose run --rm) ──────
  v6-enqueue:
    build:
      context: ./services/v6-enqueue
      dockerfile: Dockerfile
    image: ${REGISTRY_URL:-localhost:5000}/content-pipeline-stack/v6-enqueue:${IMAGE_TAG:-0.1.0}
    container_name: v6-enqueue
    profiles: ["v6-workers"]
    environment:
      V6_WORKDIR: ${DATA_DIR}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ${DATA_DIR}:${DATA_DIR}
      - ${OPENCLAW_DIR}/workspace/skills/brand-video-tools:${OPENCLAW_DIR}/workspace/skills/brand-video-tools
    networks:
      - content-pipeline-net

  # ─── v6-download (下载抖音 mp4, chromium fallback) ─────────────────────────
  v6-download:
    build:
      context: ./services/v6-download
      dockerfile: Dockerfile
    image: ${REGISTRY_URL:-localhost:5000}/content-pipeline-stack/v6-download:${IMAGE_TAG:-0.1.0}
    container_name: v6-download
    restart: unless-stopped
    profiles: ["v6-workers"]
    # 铁律 179.2 (2026-07-26 12:18 Cove 拍板根治): runtime 切 uid 1001 (host main user)
    # 否则 state.json 写完所有权变 root, systemd worker (uid 1001) 后续 Permission denied
    #  注: build 仍以 root 跑 (apt install 需要), 切换是 runtime-only
    user: "1001:1001"
    environment:
      V6_WORKDIR: ${DATA_DIR}
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ${DATA_DIR}:${DATA_DIR}
      - ${PLAYWRIGHT_DIR}:/ms-playwright
      - ${OPENCLAW_DIR}/workspace/skills/brand-video-tools:${OPENCLAW_DIR}/workspace/skills/brand-video-tools
      - ${OPENCLAW_DIR}/workspace/skills/douyin-batch:${OPENCLAW_DIR}/workspace/skills/douyin-batch
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: "1.0"
    networks:
      - content-pipeline-net

  # ─── v6-transcribe (HK ASR 转录, 调 host.docker.internal:18200) ─────────────
  v6-transcribe:
    build:
      context: ./services/v6-transcribe
      dockerfile: Dockerfile
    image: ${REGISTRY_URL:-localhost:5000}/content-pipeline-stack/v6-transcribe:${IMAGE_TAG:-0.1.0}
    container_name: v6-transcribe
    restart: unless-stopped
    profiles: ["v6-workers"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      V6_WORKDIR: ${DATA_DIR}
      HK_ASR_URL: ${HK_ASR_URL:-http://host.docker.internal:18200}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ${DATA_DIR}:${DATA_DIR}
    networks:
      - content-pipeline-net

  # ─── v6-distill (LLM 蒸馏 KB 卡片) ──────────────────────────────────────────
  v6-distill:
    build:
      context: ./services/v6-distill
      dockerfile: Dockerfile
    image: ${REGISTRY_URL:-localhost:5000}/content-pipeline-stack/v6-distill:${IMAGE_TAG:-0.1.0}
    container_name: v6-distill
    restart: unless-stopped
    profiles: ["v6-workers"]
    # 铁律 179.2: runtime uid 1001 (与 host main user 对齐)
    user: "1001:1001"
    environment:
      V6_WORKDIR: ${DATA_DIR}
      KB_DATA_DIR: ${DATA_DIR}/knowledge-base
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ${DATA_DIR}:${DATA_DIR}
      - ${OPENCLAW_DIR}/workspace/skills/knowledge-distill:${OPENCLAW_DIR}/workspace/skills/knowledge-distill
    networks:
      - content-pipeline-net

  # ─── v6-upload (上传到 file-service, 走容器内部网络) ─────────────────────
  v6-upload:
    build:
      context: ./services/v6-upload
      dockerfile: Dockerfile
    image: ${REGISTRY_URL:-localhost:5000}/content-pipeline-stack/v6-upload:${IMAGE_TAG:-0.1.0}
    container_name: v6-upload
    restart: unless-stopped
    profiles: ["v6-workers"]
    # 铁律 179.2: runtime uid 1001 (与 host main user 对齐)
    user: "1001:1001"
    # 铁律 179.3 (2026-07-26 12:18 Cove 拍板根治): .env FILE_SERVICE_URL=host.docker.internal:18098,
    # 容器必须有 host.docker.internal 解析能力 → extra_hosts
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      V6_WORKDIR: ${DATA_DIR}
      # 走 docker compose 内部 DNS (service name), 不是 host.docker.internal
      # host.docker.internal = docker host gateway 172.18.0.1, 那边的 :18098 是 systemd file-service, 不通
      FILE_SERVICE_URL: ${FILE_SERVICE_URL:-http://file-service:18098}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ${DATA_DIR}:${DATA_DIR}
    networks:
      - content-pipeline-net
    depends_on:
      - file-service

# ─── Networks ─────────────────────────────────────────────────────────────────
networks:
  content-pipeline-net:
    name: content-pipeline-net
    driver: bridge

# SQLite queue.db 跨 worker 共享走 host volume (不做 named volume)
volumes: {}