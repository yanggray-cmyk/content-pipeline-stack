# docker-compose.yml — content-pipeline-stack
# 9 服务: 4 default + 5 v6-workers (profile)
# 设计: 纯源码模式, 所有路径走 .env
# 别人部署: cp .env.example .env → 改路径 → docker compose up

services:

  # ─── content-pipeline-mcp (MCP protocol layer, 17 tools) ──────────────────
  content-pipeline-mcp:
    build:
      context: ./services/content-pipeline-mcp
      dockerfile: Dockerfile
    image: ${REGISTRY_URL:-localhost:5000}/content-pipeline-stack/content-pipeline-mcp:${IMAGE_TAG:-0.1.0}
    container_name: content-pipeline-mcp
    restart: unless-stopped
    ports:
      - "28092:18092"
    environment:
      NODE_ENV: production
      HOST: "0.0.0.0"
      # 铁律 192 (Phase 4-ii / 2026-07-28 14:47 Cove 拍 C 方案):
      # text-distill-service URL + token (供 MCP Tool 8 调 host 上的 HTTP service)
      TEXT_DISTILL_URL: "http://host.docker.internal:18191/distill"
      TEXT_DISTILL_TOKEN: ${TEXT_DISTILL_TOKEN:-}
    env_file:
      - ./.env
    # 铁律 192 (Phase 4-ii): 让容器能解析 host.docker.internal 到 host IP
    # (Linux Docker 27+ 需显式声明 extra_hosts, host-gateway 是 Docker 内置 magic)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Read-only access to pipeline data dir (queue.db, transcripts, cookies)
      # m11.18.7 (Cove 12:08 反思追问): pipeline_retry_dead 写入 queue.db 报
      #   'attempt to write a readonly database'. 必须改 :rw 让 tool 能 write
      - ${DATA_DIR}:${DATA_DIR}:rw
      # m11.18.7 (Cove 12:08 反思追问触发): 容器内 pgrep 看不到主机 v6 worker
      # (PID namespace 隔离) → workers_alive_count 永远 0 误报 silent failure
      # 修: bind mount host /proc 进 container, 让 checkWorkersRunning 用 /proc 看主机进程
      - /proc:/host_proc:ro
    deploy:
      resources:
        limits:
          memory: 2G          # 跟 systemd MemoryMax=2G
          cpus: "1.5"
        reservations:
          memory: 1G          # 跟 systemd MemoryHigh=1G
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:18092/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - content-pipeline-net

  # ─── file-service (Node.js video/file browsing + upload) ─────────────────────
  file-service:
    build:
      context: ./services/file-service
      dockerfile: Dockerfile
    image: ${REGISTRY_URL:-localhost:5000}/content-pipeline-stack/file-service:${IMAGE_TAG:-0.1.0}
    container_name: file-service
    restart: unless-stopped
    ports:
      - "28098:18098"
    environment:
      NODE_ENV: production
      PORT: "18098"
      FS_DATA_ROOT: ${DATA_DIR}/files
      # 铁律 201 (2026-07-29 13:31 Cove 原则: "系统在系统盘, 下载的数据在数据盘")
      # AUDIT_DIR 改到数据盘, file-service 运行时审计是 docker 数据
      AUDIT_DIR: ${DATA_DIR}/docker/file-service/audit
    env_file:
      - ./.env
    volumes:
      - ${DATA_DIR}:${DATA_DIR}
      - ${UPLOADS_DIR}:${UPLOADS_DIR}
      # 铁律 201: openclaw workspace 是"系统", 改精确 mount + ro 防止容器误写
      # 原来挂整个 OPENCLAW_DIR (14G 系统盘数据), 现在只挂 workspace 子目录 + ro
      - ${OPENCLAW_DIR}/workspace:${OPENCLAW_DIR}/workspace:ro
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    networks:
      - content-pipeline-net
    depends_on:
      - content-pipeline-mcp

  # ─── douyin-recorder (DouyinLiveRecorder upstream, ffmpeg + nodejs) ─────────
  douyin-recorder:
    profiles: ["v6-workers"]
    build:
      context: ./services/douyin-recorder/source
      dockerfile: ../Dockerfile
    image: ${REGISTRY_URL:-localhost:5000}/content-pipeline-stack/douyin-recorder:${IMAGE_TAG:-0.1.0}
    container_name: douyin-recorder
    restart: unless-stopped
    stdin_open: true
    tty: true
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      PYTHONUNBUFFERED: "1"
    volumes:
      - ${RECORDER_DIR}/config:/app/config
      - ${RECORDER_DIR}/downloads:/app/downloads
      - ${RECORDER_DIR}/logs:/app/logs
      - ${RECORDER_DIR}/backup_config:/app/backup_config
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: "1.5"
    networks:
      - content-pipeline-net
    depends_on:
      - content-pipeline-mcp

  # ─── v6-monitor (抖音账号监控 daemon, 6h 间隔) ─────────────────────────────
  # 铁律 200.4 (2026-07-28 19:46 Cove 拍板): systemd v6-monitor.service 是真源 (host 进程),
  #   docker 200M memory limit 反复 OOM kill (137), 与 systemd 6h daemon 冲突.
  #   改 profiles: ["v6-workers"] 防止 docker compose 默认 up, systemd 跑独占.
  #   要启 docker v6-monitor (debug / 临时调试) 用: docker compose --profile v6-workers up v6-monitor
  v6-monitor:
    build:
      context: ./services/v6-monitor
      dockerfile: Dockerfile
    image: ${REGISTRY_URL:-localhost:5000}/content-pipeline-stack/v6-monitor:${IMAGE_TAG:-0.1.0}
    container_name: v6-monitor
    profiles: ["v6-workers"]
    restart: unless-stopped
    environment:
      V6_WORKDIR: ${DATA_DIR}
      V6_ACCOUNTS_FILE: ${DATA_DIR}/config/accounts.json
      BRAND_VIDEO_ROOT: ${OPENCLAW_DIR}/workspace/skills/brand-video-tools
      MCP_URL: http://content-pipeline-mcp:18092/mcp
      DOUYIN_COOKIE_PATH: ${DATA_DIR}/config/cookies
      TZ: ${TZ:-Asia/Shanghai}
    env_file:
      - ./.env
    volumes:
      - ${DATA_DIR}:${DATA_DIR}
      - ${OPENCLAW_DIR}/workspace/skills/brand-video-tools:${OPENCLAW_DIR}/workspace/skills/brand-video-tools
    deploy:
      resources:
        limits:
          memory: 200M
          cpus: "0.5"
    networks:
      - content-pipeline-net
    depends_on:
      - content-pipeline-mcp

  # ─── v6-enqueue (cron-driven, sleep infinity + docker compose run --rm) ──────
  v6-enqueue:
    build:
      context: ./services/v6-enqueue
      dockerfile: Dockerfile
    image: ${REGISTRY_URL:-localhost:5000}/content-pipeline-stack/v6-enqueue:${IMAGE_TAG:-0.1.0}
    container_name: v6-enqueue
    profiles: ["v6-workers"]
    environment:
      V6_WORKDIR: ${DATA_DIR}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ${DATA_DIR}:${DATA_DIR}
      - ${OPENCLAW_DIR}/workspace/skills/brand-video-tools:${OPENCLAW_DIR}/workspace/skills/brand-video-tools
    networks:
      - content-pipeline-net


  # ─── v6-transcribe (v285.78.22 退役: 统一只用 host systemd v6-transcribe-0..7) ─────────────
  # 退役原因 (Cove 2026-08-14 23:50 拍板): docker + host 双 worker 消费同一 transcribe.jsonl = race (铁律 0.31),
  #   且 docker 0 done/h 几乎空转. 保留 host 8 实例为唯一主力. 本服务仅留作历史参考, 不要启动.
  v6-transcribe:
    build:
      context: ./services/v6-transcribe
      dockerfile: Dockerfile
    image: ${REGISTRY_URL:-localhost:5000}/content-pipeline-stack/v6-transcribe:${IMAGE_TAG:-0.1.0}
    container_name: v6-transcribe
    restart: unless-stopped
    profiles: ["v6-workers", "retired-do-not-start"]  # v285.78.22: 加 retired profile 防误启
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      V6_WORKDIR: ${DATA_DIR}
      HK_ASR_URL: ${HK_ASR_URL:-http://host.docker.internal:18200}
      # 铁律 v285.72.2: ASR_HOST 告诉 v285_64_asr_router 怎么连 host 上的 :18200 / :18201
      # container 内 localhost 是容器自己, 需要 host.docker.internal (docker 27+ 内置 host-gateway)
      # host systemd worker 不传这个 env, router 走默认 localhost (跟 host 一致)
      ASR_HOST: host.docker.internal
      # v285.78.22 反思闭环: 恢复 40 灰度. funasr 23:11 重启后已恢复 (23:15 host worker 成功转录 zhaofeng).
      # sherpa 冷启动慢 (首次推理加载模型, 超时 137s 误判 fail), 不宜 100% 切. 40% 双活最稳.
      ASR_GRAY_RATIO: "40"
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ${DATA_DIR}:${DATA_DIR}
      # 铁律 v285.54.4 (2026-08-10 21:15 Cove 拍板根治): mount RECORDER_DIR/downloads (livestream mp4 真源)
      # 根因: 民族直播 mp4 在 RECORDER_DIR 物理路径, docker transcribe 没 mount → ffmpeg 找不到 mp4
      #       (虽 v6-transcribe 当前 Exited, 但 docker 部署时 mount 必须存在)
      # 修复: bind-mount RECORDER_DIR/downloads 进容器 (ro), 让 ffmpeg 能读 mp4
      - ${MOUNT_REAL_DIR}/downloads:${RECORDER_DIR}/downloads:ro
      # 铁律 v285.72 (2026-08-13 21:30 根治): queue.db 存的是 /mnt/douyin-live-recordings/... 绝对路径
      # 根因: queue.db payload.mp4_path = /mnt/douyin-live-recordings/downloads/... 
      #       但 container 内只有 /home/main/DouyinLiveRecorder/downloads (通过上面的 mount)
      #       worker 尝试访问 /mnt/douyin-live-recordings/... → 立即失败 → "transcribe fail in 0.0s"
      # 修复: 直接 mount /mnt/douyin-live-recordings 到同路径, 让 queue.db 绝对路径在 container 内有效
      # v285.72.1 (2026-08-13 22:00 根治): 改 ro → rw, 因为 worker 要写 .wav 中间文件
      # 根因: ro mount → extract_wav 写 .wav → OSError Errno 30 Read-only filesystem
      # 修复: 改 rw (worker 进程是 main:1001, 写权限已限定, 安全可控)
      - ${MOUNT_REAL_DIR}:${MOUNT_REAL_DIR}:rw
    networks:
      - content-pipeline-net

  # ─── v6-distill (LLM 蒸馏 KB 卡片) ──────────────────────────────────────────
  v6-distill:
    build:
      context: ./services/v6-distill
      dockerfile: Dockerfile
    image: ${REGISTRY_URL:-localhost:5000}/content-pipeline-stack/v6-distill:${IMAGE_TAG:-0.1.0}
    container_name: v6-distill
    restart: unless-stopped
    profiles: ["v6-workers"]
    # 铁律 179.2: runtime uid 1001 (与 host main user 对齐)
    user: "1001:1001"
    environment:
      V6_WORKDIR: ${DATA_DIR}
      KB_DATA_DIR: ${DATA_DIR}/knowledge-base
      TZ: ${TZ:-Asia/Shanghai}
      # 铁律 107/146 (2026-07-28 13:01 Cove 拍板): ALLOWED_AUTHORS 含 human name + alias 兜底
      # B 方案 2026-07-28 16:00: 这是 FALLBACK env, single source 是 accounts.json
      # worker 启动时优先读 accounts.json enabled=True, 加载失败才用 env
      # v274 (2026-08-04 21:50): 同步到 accounts.json 真源全集 20 字串 (10 enabled 账户 × author + alias)
      # 之前 16 字串缺 tangsir_livestream/tibetan_a/tibetan_b/minzu + 4 author 新全名
      DISTILL_ALLOWED_AUTHORS: danran_jade_c,daya,jade_a,jade_b,jade_e,minzu,tangsir_livestream,tibetan_a,tibetan_b,yuzhiyuan,北京民族商店甄选直播间,唐Sir·主播培训8月8-10日,大雅,宏硕说玉｜NGTC宝石学家,懂藏,淡然苏工河磨玉1号,玉之源,玉留君 大得鉴宝,识藏,飞哥看过没有假货
    volumes:
      - ${DATA_DIR}:${DATA_DIR}
      - ${OPENCLAW_DIR}/workspace/skills/knowledge-distill:${OPENCLAW_DIR}/workspace/skills/knowledge-distill
      # 铁律 199 (2026-07-28 12:25 Cove 拍板): ro mount ts-lb/api-keys.json (LLM API key source)
      # distill-llm.py load_keys_from_file() 读 /home/main/.openclaw/workspace/ts-lb/api-keys.json
      # bind-mount readonly 防 worker 意外改 keys
      - ${OPENCLAW_DIR}/workspace/ts-lb:${OPENCLAW_DIR}/workspace/ts-lb:ro
      # B 方案 2026-07-28 16:00 (Cove 15:53 拍 B): accounts.json 是 single source of truth
      # v6_distill_worker.py 启动时读这个, 加载 enabled=True 的 name + alias 作 ALLOWED_AUTHORS
      # bind-mount readonly 防 worker 改配置
      - ${DATA_DIR}/scripts/v6_pipeline/monitor:${DATA_DIR}/scripts/v6_pipeline/monitor:ro
      # 铁律 v285.54.4 (2026-08-10 21:15 Cove 拍板根治): mount RECORDER_DIR/downloads (livestream mp4 真源)
      # 根因: 民族直播 mp4 在 RECORDER_DIR 物理路径, docker 容器没 mount → mark_done 200.7 误删 mp4_path
      #       → upload worker 找不到 mp4 → 145 guard 跳过 unlink → mp4 永存
      # 修复: bind-mount RECORDER_DIR/downloads 进容器 (ro), 让 worker 能 stat mp4 物理存在
      # v285.72 修复: 用 MOUNT_REAL_DIR 真源路径 (避免 symlink 不被 docker bind mount 跟随)
      - ${MOUNT_REAL_DIR}/downloads:${RECORDER_DIR}/downloads:ro
    networks:
      - content-pipeline-net

  # ─── v6-upload (上传到 file-service, 走容器内部网络) ─────────────────────
  v6-upload:
    build:
      context: ./services/v6-upload
      dockerfile: Dockerfile
    image: ${REGISTRY_URL:-localhost:5000}/content-pipeline-stack/v6-upload:${IMAGE_TAG:-0.1.0}
    container_name: v6-upload
    restart: unless-stopped
    profiles: ["v6-workers"]
    # 铁律 179.2: runtime uid 1001 (与 host main user 对齐)
    user: "1001:1001"
    # 铁律 179.3 (2026-07-26 12:18 Cove 拍板根治): .env FILE_SERVICE_URL=host.docker.internal:18098,
    # 容器必须有 host.docker.internal 解析能力 → extra_hosts
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      V6_WORKDIR: ${DATA_DIR}
      # 走 docker compose 内部 DNS (service name), 不是 host.docker.internal
      # host.docker.internal = docker host gateway 172.18.0.1, 那边的 :18098 是 systemd file-service, 不通
      FILE_SERVICE_URL: ${FILE_SERVICE_URL:-http://file-service:18098}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ${DATA_DIR}:${DATA_DIR}
      # 铁律 v285.54.4 (2026-08-10 21:15 Cove 拍板根治): mount RECORDER_DIR/downloads (livestream mp4 真源)
      # 根因: 民族直播 mp4 在 RECORDER_DIR 物理路径, docker 容器没 mount → upload worker 找不到 mp4
      #       → 145 guard 跳过 unlink → mp4 永存
      # 修复: bind-mount RECORDER_DIR/downloads 进容器 (ro), 让 upload worker 能读 mp4 物理存在
      # v285.72 修复: 用 MOUNT_REAL_DIR 真源路径 (避免 symlink 不被 docker bind mount 跟随)
      - ${MOUNT_REAL_DIR}/downloads:${RECORDER_DIR}/downloads:ro
    networks:
      - content-pipeline-net
    depends_on:
      - file-service

# ─── Networks ─────────────────────────────────────────────────────────────────
networks:
  content-pipeline-net:
    name: content-pipeline-net
    driver: bridge

# SQLite queue.db 跨 worker 共享走 host volume (不做 named volume)
volumes: {}